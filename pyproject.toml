[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-system"
version = "0.1.0"
description = "Math grading and error attribution workflow built with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.10",
    "langchain-core>=0.3.18",
    "pydantic>=2.9.2",
    "sympy>=1.13.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.9.0",
    "httpx>=0.27.2",
    "gradio>=5.5.0",
]

[tool.setuptools.packages.find]
include = ["grade_system*"]
